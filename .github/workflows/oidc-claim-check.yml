name: OIDC claim check

# Temporary DEV claim test. Dispatch it from refs/heads/dev.
# Do not add environment: production to this file.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print aud, sub, ref, and repository
        shell: bash
        env:
          EXPECTED_REF: refs/heads/dev
        run: |
          set -euo pipefail
          set +x
          if [ "${ACTIONS_STEP_DEBUG:-false}" = "true" ] || [ "${RUNNER_DEBUG:-0}" = "1" ]; then
            echo "::error::Refusing to request a token while debug logging is enabled."
            exit 1
          fi
          if [ "$GITHUB_REF" != "$EXPECTED_REF" ]; then
            echo "::error::Refusing to continue. github.ref does not match expected_ref."
            exit 1
          fi
          node --input-type=module <<'ENDNODE'
          const fail = (message) => {
            console.error(`::error::${message}`);
            process.exit(1);
          };
          const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if (!requestUrl || !requestToken) fail("Token request configuration is missing.");
          let endpoint;
          try {
            endpoint = new URL(requestUrl);
          } catch {
            fail("Token request configuration was not usable.");
          }
          endpoint.searchParams.set("audience", "sts.amazonaws.com");
          let response;
          try {
            response = await fetch(endpoint, {
              method: "GET",
              headers: {
                Accept: "application/json",
                Authorization: `bearer ${requestToken}`,
              },
            });
          } catch {
            fail("Token request failed.");
          }
          if (!response.ok) fail("Token request failed.");
          let parsed;
          try {
            parsed = await response.json();
          } catch {
            fail("Token response was not valid JSON.");
          }
          if (
            parsed === null ||
            typeof parsed !== "object" ||
            Array.isArray(parsed) ||
            typeof parsed.value !== "string" ||
            parsed.value.length === 0
          ) {
            fail("Token response did not contain a JWT value.");
          }
          const jwt = parsed.value;
          if (/[\r\n%]/.test(jwt)) fail("Token value could not be masked safely.");
          process.stdout.write(`::add-mask::${jwt}\n`);
          const segment = /^[A-Za-z0-9_-]+$/;
          const parts = jwt.split(".");
          if (parts.length !== 3 || parts.some((part) => !segment.test(part))) {
            fail("Token value was not a JWT.");
          }
          let claims;
          try {
            const payload = parts[1].replace(/-/g, "+").replace(/_/g, "/");
            claims = JSON.parse(Buffer.from(payload, "base64").toString("utf8"));
          } catch {
            fail("Token payload could not be decoded.");
          }
          if (claims === null || typeof claims !== "object" || Array.isArray(claims)) {
            fail("Token payload was not an object.");
          }
          for (const key of ["aud", "sub", "ref", "repository"]) {
            const value = claims[key];
            if (typeof value === "string" && value.length > 0) console.log(`${key}=${value}`);
            else console.log(`${key}=absent`);
          }
          ENDNODE
