            if [ -z "$token" ]; then
              break
            fi
          done
          printf '%s' "$page_count" > "$RUNNER_TEMP/changeset-pages/page-count"
          PAGE_DIR="$RUNNER_TEMP/changeset-pages" PAGE_COUNT_FILE="$RUNNER_TEMP/changeset-pages/page-count" node <<'NODE'
          const fs = require("fs");
          const allowed = new Set(["ApiFunction", "VendorApiFunction", "ReviewEmailsCronFunction", "SesEmailCronFunction", "BounceSyncFunction", "ImageOptimizeFunction"]);
          const expectedArn = process.env.CHANGE_SET_ARN;
          const expectedStack = "arn:aws:cloudformation:us-east-1:796174527529:stack/hr-ecom-prod/2a108a70-6fef-11f1-b9cd-0ecd986e35d1";
          const pageCount = Number(fs.readFileSync(process.env.PAGE_COUNT_FILE, "utf8"));
          if (!Number.isInteger(pageCount) || pageCount < 1) {
            console.error("::error::No change-set pages were collected.");
            process.exit(1);
          }
          const changes = [];
          for (let i = 1; i <= pageCount; i += 1) {
            const page = JSON.parse(fs.readFileSync(`${process.env.PAGE_DIR}/page-${i}.json`, "utf8"));
            const keys = Object.keys(page).sort().join(",");
            if (keys !== "ChangeSetId,Changes,ExecutionStatus,NextToken,StackId,Status") {
              console.error("::error::describe-change-set returned an unexpected field set.");
              process.exit(1);
            }
            if (page.ChangeSetId !== expectedArn || page.StackId !== expectedStack || page.Status !== "CREATE_COMPLETE" || page.ExecutionStatus !== "AVAILABLE") {
              console.error("::error::Change set identity or status is not acceptable.");
              process.exit(1);
            }
            if (!Array.isArray(page.Changes)) {
              console.error("::error::Change set page did not contain a resource-change list.");
              process.exit(1);
            }
            if (i < pageCount && (typeof page.NextToken !== "string" || page.NextToken === "")) {
              console.error("::error::Change-set pagination stopped before the final page.");
              process.exit(1);
            }
            if (i === pageCount && page.NextToken) {
              console.error("::error::The final change-set page still has NextToken.");
              process.exit(1);
            }
            for (const change of page.Changes) changes.push(change);
          }
          const rejected = changes.filter((change) => {
            const fields = Object.keys(change).sort().join(",");
            return !(fields === "Action,LogicalResourceId,Replacement,ResourceType"
              && change.Action === "Modify"
              && change.ResourceType === "AWS::Lambda::Function"
              && allowed.has(change.LogicalResourceId)
              && String(change.Replacement).toLowerCase() === "false");
          });
          if (process.env.WRITE_SUMMARY === "1") {
            const stageA = process.env.SUMMARY_KIND === "stage-a";
            const lines = [
              stageA ? "### Stage A change set" : "### Reviewed production change set",
              "",
              stageA
                ? "This change-set ARN is unapproved for execution outside Stage B."
                : "This review does not execute the change set. Environment approval is still required.",
              "",
              "Executing this change set permanently associates `arn:aws:iam::796174527529:role/hr-ecom-prod-cloudformation-exec` with `hr-ecom-prod`. That association cannot be removed.",
              "",
              `- change_set_arn=\`${expectedArn}\``,
              "- execution_approval=unapproved-outside-stage-b",
              `- StackId: \`${expectedStack}\``,
              "- Status: CREATE_COMPLETE",
              "- ExecutionStatus: AVAILABLE",
              `- Pages: ${pageCount}`,
              `- review_result=${changes.length && rejected.length === 0 ? "allowlist-passed" : "rejected"}`,
              "",
              "| Action | Logical ID | Resource type | Replacement |",
              "| --- | --- | --- | --- |",
              ...changes.map((change) => `| ${change.Action || ""} | ${change.LogicalResourceId || ""} | ${change.ResourceType || ""} | ${change.Replacement ?? ""} |`),
              "",
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          }
          if (changes.length === 0 || rejected.length !== 0) {
            console.error(`::error::Rejected resource change ${rejected[0] && rejected[0].LogicalResourceId || "none"}.`);
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `change_set_arn=${expectedArn}\n`);
          NODE
          rm -f "$RUNNER_TEMP"/changeset-pages/page-*.json "$RUNNER_TEMP/changeset-pages/page-count" "$RUNNER_TEMP/changeset-pages/seen-tokens"

          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::Production change-set execution is allowed only from refs/heads/main."
            exit 1
          fi
          if [ "${CONFIRM:-}" != "execute-reviewed-change-set" ]; then
            echo "::error::Exact confirmation is required."
