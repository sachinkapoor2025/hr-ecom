name: Deploy

# Trigger: push to main/dev/feature/* or manual workflow_dispatch.
on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy-api:
    # A dev-only API publish can opt out of the production stack with "[skip prod]".
    if: ${{ !contains(github.event.head_commit.message, '[skip prod]') }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run build -w @hr-ecom/shared

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/setup-sam@v3

      - name: SAM Deploy
        working-directory: infrastructure
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZOR_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZOR_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          USPS_CLIENT_ID: ${{ secrets.USPS_CLIENT_ID }}
          USPS_CLIENT_SECRET: ${{ secrets.USPS_CLIENT_SECRET }}
          USPS_SECRET_ARN: ${{ secrets.USPS_SECRET_ARN }}
          USPS_BASE_URL: ${{ secrets.USPS_BASE_URL }}
          USPS_CRID: ${{ secrets.USPS_CRID }}
          USPS_MID: ${{ secrets.USPS_MID }}
          USPS_EPS_ACCOUNT_NUMBER: ${{ secrets.USPS_EPS_ACCOUNT_NUMBER }}
          USPS_PAYMENT_AUTHORIZATION_TOKEN: ${{ secrets.USPS_PAYMENT_AUTHORIZATION_TOKEN }}
          ORANGE_COUNTY_VENDOR_API_KEY: ${{ secrets.ORANGE_COUNTY_VENDOR_API_KEY }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_TEMPLATE_LANG: ${{ secrets.WHATSAPP_TEMPLATE_LANG }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          MARKETING_SMTP_PASS: ${{ secrets.MARKETING_SMTP_PASS }}
        run: |
          # Omit empty WhatsApp/Twilio/marketing overrides so a prior SAM deploy's values are not wiped.
          BASE_URL="${USPS_BASE_URL:-https://apis.usps.com}"
          EXTRA=""
          [ -n "${WHATSAPP_TOKEN:-}" ] && EXTRA="$EXTRA WhatsAppToken=${WHATSAPP_TOKEN}"
          [ -n "${WHATSAPP_PHONE_NUMBER_ID:-}" ] && EXTRA="$EXTRA WhatsAppPhoneNumberId=${WHATSAPP_PHONE_NUMBER_ID}"
          [ -n "${WHATSAPP_TEMPLATE_NAME:-}" ] && EXTRA="$EXTRA WhatsAppTemplateName=${WHATSAPP_TEMPLATE_NAME}"
          [ -n "${WHATSAPP_TEMPLATE_LANG:-}" ] && EXTRA="$EXTRA WhatsAppTemplateLang=${WHATSAPP_TEMPLATE_LANG}"
          [ -n "${TWILIO_ACCOUNT_SID:-}" ] && EXTRA="$EXTRA TwilioAccountSid=${TWILIO_ACCOUNT_SID}"
          [ -n "${TWILIO_AUTH_TOKEN:-}" ] && EXTRA="$EXTRA TwilioAuthToken=${TWILIO_AUTH_TOKEN}"
          [ -n "${TWILIO_WHATSAPP_FROM:-}" ] && EXTRA="$EXTRA TwilioWhatsAppFrom=${TWILIO_WHATSAPP_FROM}"
          if [ -n "${MARKETING_SMTP_PASS:-}" ]; then
            EXTRA="$EXTRA MarketingSmtpPassword=${MARKETING_SMTP_PASS}"
          else
            echo "::warning::MARKETING_SMTP_PASS secret is empty — marketing campaigns need Mailercloud credentials in Admin → Email → Settings (or set the GitHub secret)."
          fi
          [ -n "${RAZORPAY_WEBHOOK_SECRET:-}" ] && EXTRA="$EXTRA RazorpayWebhookSecret=${RAZORPAY_WEBHOOK_SECRET}"
          sam build && sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --config-env prod \
            --parameter-overrides "\
          Environment=prod \
          RazorpayKeyId=${RAZORPAY_KEY_ID} \
          RazorpayKeySecret=${RAZORPAY_KEY_SECRET} \
          SmtpPassword=${SMTP_PASSWORD} \
          StripeSecretKey=${STRIPE_SECRET_KEY} \
          StripeWebhookSecret=${STRIPE_WEBHOOK_SECRET} \
          UspsClientId=${USPS_CLIENT_ID} \
          UspsClientSecret=${USPS_CLIENT_SECRET} \
          UspsSecretArn=${USPS_SECRET_ARN} \
          UspsBaseUrl=${BASE_URL} \
          UspsCrid=${USPS_CRID} \
          UspsMid=${USPS_MID} \
          UspsEpsAccountNumber=${USPS_EPS_ACCOUNT_NUMBER} \
          UspsPaymentAuthorizationToken=${USPS_PAYMENT_AUTHORIZATION_TOKEN} \
          OrangeCountyVendorApiKey=${ORANGE_COUNTY_VENDOR_API_KEY}${EXTRA}"

      - name: Restore UsaRakhi inventory after OOS pause
        env:
          ENVIRONMENT: prod
          INVENTORY: "200"
        run: npx tsx scripts/restore-usarakhi-inventory.ts

      # Do not re-run scripts/set-usarakhi-plain-rakhi-prices.ts here — that $3/$5/$7
      # job overwrites the live $1.99 / $2.50 / $2.99 / $4.99 catalog. Use
      # scripts/apply-catalog-price-reset.ts manually if prices need a refresh.

      # Catalog import OVERWRITES product records and has wiped admin-uploaded images.
      # Run manually only: Actions → Import UsaRakhi Catalog (workflow_dispatch).

  # Amplify dev calls https://…/dev (hr-ecom-api-dev). The production SAM deploy
  # above does not update that function, so festival slugs stay missing and
  # add-to-cart returns "Product not found". Publish only this function's code.
  deploy-dev-api:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run build -w @hr-ecom/shared
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/setup-sam@v3
      - name: Publish API code to the dev storefront function
        working-directory: infrastructure
        run: |
          sam build ApiFunction
          (cd .aws-sam/build/ApiFunction && zip -qr "$RUNNER_TEMP/api-dev.zip" .)
          # The dev site calls API 0iwn6h2ds8. The function name is not hr-ecom-api-dev.
          uris=$(aws apigatewayv2 get-integrations --api-id 0iwn6h2ds8 --query "Items[].IntegrationUri" --output text 2>"$RUNNER_TEMP/api-lookup.err" || true)
          if [ -z "$uris" ]; then
            err=$(tr '\n' ' ' < "$RUNNER_TEMP/api-lookup.err" | head -c 700)
            echo "::error::could not read dev API integrations: ${err}"
            exit 1
          fi
          func=$(printf '%s\n' $uris | sed -n 's/.*function:\([^/]*\).*/\1/p' | head -n 1)
          if [ -z "$func" ]; then
            echo "::error::no Lambda integration on API 0iwn6h2ds8: ${uris}"
            exit 1
          fi
          echo "Updating dev function $func"
          if ! aws lambda update-function-code \
            --function-name "$func" \
            --zip-file "fileb://$RUNNER_TEMP/api-dev.zip" \
            > "$RUNNER_TEMP/lambda-update.json" \
            2> "$RUNNER_TEMP/lambda-update.err"; then
            err=$(tr '\n' ' ' < "$RUNNER_TEMP/lambda-update.err" | head -c 700)
            echo "::error::dev lambda update failed for ${func}: ${err}"
            exit 1
          fi
          aws lambda wait function-updated --function-name "$func"

  # Read-only: surface the marketing-email error from CloudWatch. Does not change stacks.
  marketing-email-logs:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read recent marketing email errors
        run: |
          set +e
          start=$(( ($(date +%s) - 604800) * 1000 ))
          groups=$(aws logs describe-log-groups --log-group-name-prefix "/aws/lambda/hr-ecom" --query "logGroups[].logGroupName" --output text 2>"$RUNNER_TEMP/logs.err")
          if [ -z "$groups" ]; then
            err=$(tr '\n' ' ' < "$RUNNER_TEMP/logs.err" | head -c 500)
            echo "::error::could not list log groups: ${err}"
            exit 1
          fi
          echo "Log groups: $groups"
          echo "::warning::Log groups: ${groups}"
          found=0
          uris=$(aws apigatewayv2 get-integrations --api-id 0iwn6h2ds8 --query "Items[].IntegrationUri" --output text 2>>"$RUNNER_TEMP/logs.err" || true)
          func=$(printf '%s\n' $uris | sed -n 's/.*function:\([^/]*\).*/\1/p' | head -n 1)
          echo "::warning::Dev API function: ${func:-unknown}"
          if [ -n "$func" ]; then
            aws lambda get-function-configuration --function-name "$func" \
              --query "Environment.Variables.{hasPass:MARKETING_SMTP_PASS,host:MARKETING_SMTP_HOST,user:MARKETING_SMTP_USER,transport:MARKETING_TRANSPORT,table:EMAIL_CAMPAIGNS_TABLE}" \
              --output json > "$RUNNER_TEMP/fn.json" 2>>"$RUNNER_TEMP/logs.err" || true
            summary=$(python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"fn.json"; raw=p.read_text(errors="replace") if p.exists() else "{}";
d=json.loads(raw or "{}"); pw=str(d.get("hasPass") or "").strip();
print("host=%s user=%s transport=%s table=%s passwordSet=%s passwordLength=%s" % (d.get("host"), d.get("user"), d.get("transport"), d.get("table"), bool(pw), len(pw)))')
            echo "::warning::Dev function env: ${summary}"
            for pattern in '"sendTest failed"' '"Marketing SMTP"' '"Task timed out"' '"Test email sent"'; do
              : > "$RUNNER_TEMP/dev-events.txt"
              aws logs filter-log-events \
                --log-group-name "/aws/lambda/${func}" \
                --start-time "$start" \
                --filter-pattern "$pattern" \
                --limit 3 \
                --query "events[].message" \
                --output text > "$RUNNER_TEMP/dev-events.txt" 2>>"$RUNNER_TEMP/logs.err" || true
              if [ -s "$RUNNER_TEMP/dev-events.txt" ]; then
                found=1
                msg=$(tr '\n' ' ' < "$RUNNER_TEMP/dev-events.txt" | head -c 650)
                echo "::warning title=dev ${pattern}::${msg}"
              fi
            done
          fi
          for pattern in '"sendTest failed"' '"queue send failed"' '"Marketing SMTP"' '"Failed to load SES"' '"MessageRejected"' '"Task timed out"' '"Test email sent"'; do
            for group in $groups; do
              : > "$RUNNER_TEMP/events.txt"
              aws logs filter-log-events \
                --log-group-name "$group" \
                --start-time "$start" \
                --filter-pattern "$pattern" \
                --limit 3 \
                --query "events[].message" \
                --output text > "$RUNNER_TEMP/events.txt" 2>>"$RUNNER_TEMP/logs.err" || true
              if [ -s "$RUNNER_TEMP/events.txt" ]; then
                found=1
                msg=$(tr '\n' ' ' < "$RUNNER_TEMP/events.txt" | head -c 650)
                echo "::warning title=${group} ${pattern}::${msg}"
              fi
            done
          done
          if [ "$found" -eq 0 ]; then
            err=$(tr '\n' ' ' < "$RUNNER_TEMP/logs.err" | head -c 400)
            echo "::warning::No marketing email log lines in the last 7 days. ${err}"
          fi

  deploy-web:
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Export SAM outputs for web build
        run: |
          output() {
            aws cloudformation describe-stacks \
              --stack-name hr-ecom-prod \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" \
              --output text
          }

          echo "NEXT_PUBLIC_API_URL=$(output ApiUrl)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_COGNITO_USER_POOL_ID=$(output UserPoolId)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_COGNITO_CLIENT_ID=$(output UserPoolClientId)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_CDN_URL=https://$(output CloudFrontDomain)" >> "$GITHUB_ENV"
      - run: npm run build -w @hr-ecom/shared
      - run: npm run build -w @hr-ecom/web
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.RAZOR_KEY_ID }}
          NEXT_PUBLIC_COGNITO_REGION: ${{ env.AWS_REGION }}
          NEXT_PUBLIC_USD_INR_RATE: ${{ secrets.NEXT_PUBLIC_USD_INR_RATE }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID }}
          NEXT_PUBLIC_CLARITY_ID: ${{ secrets.NEXT_PUBLIC_CLARITY_ID }}
          NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_GA4_ID: ${{ secrets.NEXT_PUBLIC_GA4_ID }}

      - name: Deploy note
        run: |
          echo "Connect AWS Amplify to this repo — amplify.yml is configured."
          echo "Set Amplify env: RAZOR_KEY_ID (same as GitHub secret) for Razorpay checkout."
