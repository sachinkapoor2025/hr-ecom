        env:
          CHANGE_SET_ARN: ${{ github.event.inputs.change_set_arn }}
          VERIFIED_ARN: ${{ needs.verify-prod-changeset.outputs.change_set_arn }}
          CONFIRM: ${{ github.event.inputs.confirm }}
          REVIEW_CONTEXT: stage-b
          WRITE_SUMMARY: "0"
          SUMMARY_KIND: stage-b
        run: |
          set -euo pipefail
          if [ "${CHANGE_SET_ARN:-}" != "${VERIFIED_ARN:-}" ]; then
            echo "::error::Stage B input does not match the change set verified in this run."
            exit 1
          fi
          set -euo pipefail
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::Production change-set review is allowed only from refs/heads/main."
            exit 1
          fi
          if [ "${REVIEW_CONTEXT:-}" = "stage-b" ]; then
            if [ "${CONFIRM:-}" != "execute-reviewed-change-set" ]; then
              echo "::error::Exact confirmation is required."
              exit 1
            fi
          elif [ "${REVIEW_CONTEXT:-}" = "stage-a" ]; then
            if [ "${PROD_STAGE:-}" != "create-change-set" ]; then
              echo "::error::Stage A review requires create-change-set."
              exit 1
            fi
          else
            echo "::error::Unknown change-set review context."
            exit 1
          fi
          if ! [[ "${CHANGE_SET_ARN:-}" =~ ^arn:aws:cloudformation:us-east-1:796174527529:changeSet/samcli-deploy[0-9]+/[A-Za-z0-9-]+$ ]]; then
            echo "::error::Change-set ARN does not match the production SAM pattern."
            exit 1
          fi
          QUERY='{ChangeSetId:ChangeSetId,StackId:StackId,Status:Status,ExecutionStatus:ExecutionStatus,NextToken:NextToken,Changes:Changes[].ResourceChange.{Action:Action,LogicalResourceId:LogicalResourceId,ResourceType:ResourceType,Replacement:Replacement}}'
          case "$QUERY" in
            *Parameter*) echo "::error::Change-set query is not limited to the approved fields."; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/changeset-pages"
          seen_file="$RUNNER_TEMP/changeset-pages/seen-tokens"
          : > "$seen_file"
          page_count=0
          token=""
          while true; do
            page_count=$((page_count + 1))
