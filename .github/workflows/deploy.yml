                exit 1
              fi
              printf '%s\n' "$token" >> "$seen_file"
              aws cloudformation describe-change-set --stack-name hr-ecom-prod --change-set-name "$CHANGE_SET_ARN" --next-token "$token" --query "$QUERY" --output json > "$page_file"
            else
