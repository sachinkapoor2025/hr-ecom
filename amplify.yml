version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use 22
            # Workspace symlink cache can restore stale packages/shared over this commit.
            - git checkout -- packages apps/web
            - npm ci
            - npm run build -w @hr-ecom/shared
        build:
          commands:
            - |
              STACK_NAME=${STACK_NAME:-hr-ecom-prod}
              ENV_FILE="apps/web/.env.production"
              if [ ! -d "apps/web" ]; then ENV_FILE=".env.production"; fi
              # Live and dev share the production user pool, so one email and password signs in on both.
              # These ids are already public in the storefront bundle. CloudFormation overrides them when the build can read hr-ecom-prod.
              PROD_POOL="us-east-1_TXu5ecEgd"
              PROD_CLIENT="1vjk8p4d81d0oi34it8t1i4a9m"
              if command -v aws >/dev/null 2>&1; then
                output() {
                  aws cloudformation describe-stacks \
                    --stack-name "$1" \
                    --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue | [0]" \
                    --output text 2>/dev/null || true
                }
                LOOKUP_POOL=$(output hr-ecom-prod UserPoolId)
                LOOKUP_CLIENT=$(output hr-ecom-prod UserPoolClientId)
                if [ -n "$LOOKUP_POOL" ] && [ "$LOOKUP_POOL" != "None" ]; then PROD_POOL="$LOOKUP_POOL"; fi
                if [ -n "$LOOKUP_CLIENT" ] && [ "$LOOKUP_CLIENT" != "None" ]; then PROD_CLIENT="$LOOKUP_CLIENT"; fi
                API_URL=$(output "$STACK_NAME" ApiUrl)
                CLOUDFRONT_DOMAIN=$(output "$STACK_NAME" CloudFrontDomain)
                {
                  echo "NEXT_PUBLIC_COGNITO_USER_POOL_ID=$PROD_POOL"
                  echo "NEXT_PUBLIC_COGNITO_CLIENT_ID=$PROD_CLIENT"
                  echo "NEXT_PUBLIC_COGNITO_REGION=${AWS_REGION:-us-east-1}"
                  if [ -n "$API_URL" ] && [ "$API_URL" != "None" ]; then echo "NEXT_PUBLIC_API_URL=$API_URL"; fi
                  if [ -n "$CLOUDFRONT_DOMAIN" ] && [ "$CLOUDFRONT_DOMAIN" != "None" ]; then echo "NEXT_PUBLIC_CDN_URL=https://$CLOUDFRONT_DOMAIN"; fi
                } >> "$ENV_FILE"
              fi
              # Amplify branch env vars are already set and would otherwise keep the separate dev pool.
              export NEXT_PUBLIC_COGNITO_USER_POOL_ID="$PROD_POOL"
              export NEXT_PUBLIC_COGNITO_CLIENT_ID="$PROD_CLIENT"
              export NEXT_PUBLIC_COGNITO_REGION="${AWS_REGION:-us-east-1}"
              # The dev branch env still names another project's API. Prefer the hr-ecom stack URL.
              if [ -n "${API_URL:-}" ] && [ "$API_URL" != "None" ]; then
                export NEXT_PUBLIC_API_URL="$API_URL"
              elif printf '%s' "${NEXT_PUBLIC_API_URL:-}" | grep -q '0iwn6h2ds8'; then
                export NEXT_PUBLIC_API_URL="https://foqu2ap4qi.execute-api.us-east-1.amazonaws.com/prod"
              fi
              npm run build -w @hr-ecom/web
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - "**/*"
    environment:
      variables:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${NEXT_PUBLIC_COGNITO_USER_POOL_ID}
        NEXT_PUBLIC_COGNITO_CLIENT_ID: ${NEXT_PUBLIC_COGNITO_CLIENT_ID}
        NEXT_PUBLIC_COGNITO_REGION: ${NEXT_PUBLIC_COGNITO_REGION}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${RAZOR_KEY_ID}
        NEXT_PUBLIC_CDN_URL: ${NEXT_PUBLIC_CDN_URL}
        NEXT_PUBLIC_USD_INR_RATE: ${NEXT_PUBLIC_USD_INR_RATE}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID}
        NEXT_PUBLIC_GA4_ID: ${NEXT_PUBLIC_GA4_ID}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID}
        NEXT_PUBLIC_CLARITY_ID: ${NEXT_PUBLIC_CLARITY_ID}
        NEXT_PUBLIC_BING_SITE_VERIFICATION: ${NEXT_PUBLIC_BING_SITE_VERIFICATION}
        NEXT_PUBLIC_BING_UET_ID: ${NEXT_PUBLIC_BING_UET_ID}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION}
